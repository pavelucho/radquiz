name: Publicar sitio

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.decidir.outputs.publicar }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Traer lo publicado en el estudio
        id: traer
        run: python tools/traer_publicaciones

      - name: Validar temas
        run: python tools/validar

      - name: Guardar los temas nuevos en el repositorio
        if: steps.traer.outputs.cambios == 'true'
        run: |
          git config user.name "RadQuiz"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temas
          git commit -m "Publica los cuestionarios aprobados en el estudio"
          git push

      - name: Mantener activa la publicación automática
        if: github.event_name == 'schedule' && steps.traer.outputs.cambios != 'true'
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "RadQuiz"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Mantiene activa la publicación automática"
            git push
          fi

      - name: ¿Hace falta publicar?
        id: decidir
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.traer.outputs.cambios }}" = "true" ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Armar el sitio (solo casos publicados)
        if: steps.decidir.outputs.publicar == 'true'
        run: python tools/construir_sitio

      - uses: actions/configure-pages@v6
        if: steps.decidir.outputs.publicar == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.decidir.outputs.publicar == 'true'
        with:
          path: _site

  publicar:
    needs: construir
    if: needs.construir.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
