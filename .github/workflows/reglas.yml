name: Desplegar reglas

# Las reglas de database.rules.json deciden quién puede escribir qué en la base, y no sirven de
# nada hasta que se despliegan. Hacerlo a mano se olvida, así que lo hace este workflow cada vez
# que el archivo cambia en main. El trabajo lo hace tools/desplegar_reglas, el mismo comando que
# se usa desde una sesión de Claude Code, para que el camino sea uno solo y esté probado.
#
# Hace falta una credencial en Settings → Secrets and variables → Actions. Cualquiera de las dos:
#   FIREBASE_SERVICE_ACCOUNT  el JSON de una cuenta de servicio del proyecto con el papel
#                             «Firebase Realtime Database Admin» (roles/firebasedatabase.admin).
#                             Es la recomendada: solo llega a la base. Ojo, no es «Firebase Rules
#                             Admin»: ese papel es de Firestore y Storage, y aquí no sirve.
#   FIREBASE_TOKEN            lo que imprime «firebase login:ci». Más rápido de obtener, pero vale
#                             por toda la cuenta de Google en Firebase.
# Sin credencial el workflow no falla: avisa y las reglas se quedan sin desplegar.

on:
  push:
    branches: [main]
    paths:
      - database.rules.json
      - firebase.json
      - tools/desplegar_reglas
      - .github/workflows/reglas.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Comprobar que las reglas son JSON válido
        run: |
          python3 -c "import json; json.load(open('database.rules.json'))"
          echo "database.rules.json es JSON válido"

      - name: ¿Hay credencial?
        id: credencial
        env:
          CUENTA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$CUENTA" ] || [ -n "$TOKEN" ]; then
            echo "hay=si" >> "$GITHUB_OUTPUT"
          else
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin credencial de Firebase: las reglas no se despliegan solas. Añade el secreto FIREBASE_SERVICE_ACCOUNT (cuenta de servicio con el papel Firebase Realtime Database Admin) o FIREBASE_TOKEN, o corre «firebase deploy --only database» a mano."
          fi

      - name: Desplegar las reglas
        if: steps.credencial.outputs.hay == 'si'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: python3 tools/desplegar_reglas
