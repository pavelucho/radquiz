<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Práctica · RadQuiz</title>
<meta name="theme-color" content="#0b0f14">
<link rel="icon" href="app/marca.svg" type="image/svg+xml">
<link rel="preload" href="app/fuentes/plex-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app/estilos.css">
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="brand" href="./"><img class="logo" src="app/marca.svg" alt="" width="30" height="30">RadQuiz <small id="subtitulo">Práctica</small></a>
    <span class="spacer"></span>
    <div class="herramientas compacta">
      <span class="salto" aria-hidden="true"></span>
      <label class="row" id="tanda" hidden><span class="muted">Casos</span>
        <select id="cuantos" title="Cuántos casos quieres en esta tanda"></select></label>
      <label class="row"><input type="checkbox" id="solo-verificados"> <span class="muted">Solo verificados</span></label>
      <span class="chip" id="modo">Práctica</span>
      <span class="chip" id="marcador" hidden></span>
    </div>
  </header>
  <main id="app" class="stack" aria-live="polite"><p class="muted">Cargando…</p></main>
</div>
<div class="zoom" id="zoom" hidden><img id="zoomImg" alt=""></div>
<script type="module" src="app/practica.js"></script>
</body>
</html>
