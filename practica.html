<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Práctica · RadQuiz</title>
<meta name="theme-color" content="#0c0b09">
<script>/* Animaciones: la elección de este aparato o, sin ella, la del sistema (app/movimiento.js). Va aquí para que nada empiece a moverse antes de saberlo. También decide la transición entre páginas (app/estilos.css, «transiciones»): sin animaciones no hay; al volver con «atrás» va al revés; y en un navegador sin transiciones entre páginas, el contenido entra con la misma animación en CSS. */
try{var r=document.documentElement,m=localStorage.getItem("radquiz.movimiento");if(m!=="si"&&m!=="no")m=matchMedia("(prefers-reduced-motion: reduce)").matches?"no":"si";r.dataset.movimiento=m;addEventListener("pageswap",function(e){if(e.viewTransition&&r.dataset.movimiento==="no")e.viewTransition.skipTransition()});addEventListener("pagereveal",function(e){var t=e.viewTransition,a=window.navigation&&navigation.activation;if(!t)return;if(r.dataset.movimiento==="no")return t.skipTransition();if(a&&a.navigationType==="traverse"&&a.from&&a.entry&&a.entry.index<a.from.index){r.dataset.sentido="atras";t.finished.finally(function(){delete r.dataset.sentido})}});if(m==="si"&&!("CSSViewTransitionRule" in window)){r.dataset.entrada="pagina";setTimeout(function(){delete r.dataset.entrada},800)}}catch(e){}</script>
<link rel="icon" href="app/marca.svg" type="image/svg+xml">
<link rel="preload" href="app/fuentes/atkinson-next.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app/estilos.css">
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="brand" href="./"><img class="logotipo" src="app/marca-texto.svg" alt="RadQuiz" width="110" height="22"><small id="subtitulo">Práctica</small></a>
    <span class="spacer"></span>
    <div class="herramientas compacta">
      <span class="salto" aria-hidden="true"></span>
      <label class="row"><span class="muted">Cuáles</span>
        <select id="cuales" title="De dónde sale la tanda. Lo que respondiste se guarda en este dispositivo">
          <option value="faltan">Los que me faltan</option>
          <option value="todos">Todos</option>
          <option value="falladas">Los que fallé</option>
        </select></label>
      <label class="row"><span class="muted">Respuesta</span>
        <select id="modo-respuesta" title="Sin alternativas: piensas la respuesta, la revelas y marcas si acertaste">
          <option value="alt">Con alternativas</option>
          <option value="sin">Sin alternativas</option>
        </select></label>
      <label class="row" id="tanda" hidden><span class="muted">Casos</span>
        <input type="number" id="cuantos" min="1" step="1" inputmode="numeric"
          title="Cuántos casos quieres en esta tanda: se eligen al azar entre los del tema">
        <span class="muted" id="de-total"></span></label>
      <label class="row"><input type="checkbox" id="solo-verificados"> <span class="muted">Solo verificados</span></label>
      <span class="chip" id="modo">Práctica</span>
      <span class="chip" id="marcador" hidden></span>
    </div>
  </header>
  <main id="app" class="stack" aria-live="polite"><p class="muted">Cargando…</p></main>
</div>
<script type="module" src="app/practica.js"></script>
</body>
</html>
