<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabú radiológico · RadQuiz</title>
<meta name="theme-color" content="#0c0b09">
<script>/* Animaciones: la elección de este aparato o, sin ella, la del sistema (app/movimiento.js). Va aquí para que nada empiece a moverse antes de saberlo. */try{var m=localStorage.getItem("radquiz.movimiento");if(m!=="si"&&m!=="no")m=matchMedia("(prefers-reduced-motion: reduce)").matches?"no":"si";document.documentElement.dataset.movimiento=m}catch(e){}</script>
<link rel="icon" href="app/marca.svg" type="image/svg+xml">
<link rel="preload" href="app/fuentes/atkinson-next.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app/estilos.css">
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="brand" href="./"><img class="logotipo" src="app/marca-texto.svg" alt="RadQuiz" width="110" height="22"><small id="subtitulo">Tabú radiológico</small></a>
    <span class="spacer"></span>
    <div class="herramientas">
      <button type="button" class="sonido" data-movimiento hidden aria-pressed="true">Animaciones</button>
      <a class="boton" href="manual.html#tabu">Cómo se juega</a>
      <span class="chip live" id="turno" hidden></span>
    </div>
  </header>
  <main id="app" class="stack" aria-live="polite"><p class="muted">Cargando…</p></main>
</div>
<script type="module" src="app/movimiento.js"></script>
<script type="module" src="app/tabu.js"></script>
</body>
</html>
