<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Lectura en vivo · RadQuiz</title>
<meta name="theme-color" content="#0c0b09">
<script>/* Animaciones: la elección de este aparato o, sin ella, la del sistema (app/movimiento.js). Va aquí para que nada empiece a moverse antes de saberlo. También decide la transición entre páginas (app/estilos.css, «transiciones»): sin animaciones no hay; al volver con «atrás» va al revés; y en un navegador sin transiciones entre páginas, el contenido entra con la misma animación en CSS. */
try{var r=document.documentElement,m=localStorage.getItem("radquiz.movimiento");if(m!=="si"&&m!=="no")m=matchMedia("(prefers-reduced-motion: reduce)").matches?"no":"si";r.dataset.movimiento=m;addEventListener("pageswap",function(e){if(e.viewTransition&&r.dataset.movimiento==="no")e.viewTransition.skipTransition()});addEventListener("pagereveal",function(e){var t=e.viewTransition,a=window.navigation&&navigation.activation;if(!t)return;if(r.dataset.movimiento==="no")return t.skipTransition();if(a&&a.navigationType==="traverse"&&a.from&&a.entry&&a.entry.index<a.from.index){r.dataset.sentido="atras";t.finished.finally(function(){delete r.dataset.sentido})}});if(m==="si"&&!("CSSViewTransitionRule" in window)){r.dataset.entrada="pagina";setTimeout(function(){delete r.dataset.entrada},800)}}catch(e){}</script>
<link rel="icon" href="app/marca.svg" type="image/svg+xml">
<link rel="preload" href="app/fuentes/atkinson-next.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app/estilos.css">
</head>
<body class="pagina-lectura">
<div class="wrap">

    <span class="spacer"></span>
    <div class="herramientas">
      <button type="button" id="qrMini" class="qr-mini" hidden aria-haspopup="dialog"></button>
      <span class="chip" id="rol">Conectando…</span>
      <span class="chip" id="conteo" hidden></span>
    </div>
  </header>
  <main id="app" class="stack" aria-live="polite"><p class="muted">Conectando…</p></main>
</div>
<div class="zoom zoom-qr" id="zoomQR" role="dialog" aria-label="Cómo entrar a la sesión" hidden></div>
<script type="module" src="app/transiciones.js"></script>
<script type="module" src="app/lectura-vivo.js"></script>
</body>
</html>
